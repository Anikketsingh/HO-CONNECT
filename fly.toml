# fly.toml app configuration file generated for ho-connect-api on 2026-11-07T17:09:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ho-connect-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4000'
  PUSH_PROVIDER = 'expo'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
